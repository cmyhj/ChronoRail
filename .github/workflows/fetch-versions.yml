name: Fetch Mihoyo Version Data

on:
  schedule:
    # 每天UTC时间0点运行（北京时间8点）
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  fetch-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch version data
        run: |
          node -e "
          const https = require('https');
          const fs = require('fs');

          const games = [
            {
              id: 'genshin',
              name: '原神',
              api: 'https://hk4e-ann-api.mihoyo.com/common/hk4e_cn/announcement/api/getAnnList?game=hk4e&game_biz=hk4e_cn&lang=zh-cn&bundle_id=hk4e_cn&platform=pc&region=cn_gf01&level=55&uid=100000000',
              pattern: /(\d+\.\d+)版本.*?[「「](.+?)[」」]/
            },
            {
              id: 'starrail',
              name: '崩坏：星穹铁道',
              api: 'https://hkrpg-ann-api.mihoyo.com/common/hkrpg_cn/announcement/api/getAnnList?game=hkrpg&game_biz=hkrpg_cn&lang=zh-cn&bundle_id=hkrpg_cn&platform=pc&region=prod_gf_cn&level=65&uid=100000000',
              pattern: /(\d+\.\d+)版本.*?[「「](.+?)[」」]/
            },
            {
              id: 'zzz',
              name: '绝区零',
              api: 'https://announcement-api.mihoyo.com/common/nap_cn/announcement/api/getAnnList?game=nap&game_biz=nap_cn&lang=zh-cn&bundle_id=nap_cn&platform=pc&region=prod_gf_cn&level=60&uid=100000000',
              pattern: /(\d+\.\d+)版本.*?[「「](.+?)[」」]/
            }
          ];

          function fetchGame(game) {
            return new Promise((resolve, reject) => {
              https.get(game.api, (res) => {
                let data = '';
                res.on('data', (chunk) => data += chunk);
                res.on('end', () => {
                  try {
                    const json = JSON.parse(data);
                    if (json.retcode !== 0) {
                      resolve(null);
                      return;
                    }
                    
                    const versions = [];
                    const seen = new Set();
                    
                    for (const group of json.data.list) {
                      for (const item of group.list) {
                        // 查找版本更新说明公告
                        if (item.title.includes('版本更新说明') || item.title.includes('更新公告')) {
                          const match = item.title.match(game.pattern);
                          if (match && !seen.has(match[1])) {
                            seen.add(match[1]);
                            versions.push({
                              version: match[1],
                              name: match[2],
                              startDate: item.start_time.split(' ')[0],
                              endDate: item.end_time.split(' ')[0],
                              title: item.title
                            });
                          }
                        }
                      }
                    }
                    
                    // 按版本号排序（降序）
                    versions.sort((a, b) => parseFloat(b.version) - parseFloat(a.version));
                    resolve({
                      current: versions.length > 0 ? versions[0] : null,
                      history: versions.slice(0, 10) // 保留最近10个版本
                    });
                  } catch (e) {
                    console.error('Parse error for', game.id, e);
                    resolve(null);
                  }
                });
              }).on('error', (err) => {
                console.error('Fetch error for', game.id, err);
                resolve(null);
              });
            });
          }

          async function main() {
            const results = {
              fetchedAt: new Date().toISOString(),
              games: {}
            };
            
            for (const game of games) {
              console.log('Fetching', game.id, '...');
              const data = await fetchGame(game);
              if (data && data.current) {
                results.games[game.id] = {
                  gameId: game.id,
                  gameName: game.name,
                  current: data.current,
                  history: data.history
                };
                console.log('  Current:', data.current.version, data.current.name);
              } else {
                console.log('  No data');
              }
            }
            
            fs.writeFileSync('public/data/mihoyo-versions.json', JSON.stringify(results, null, 2));
            console.log('\\nSaved to public/data/mihoyo-versions.json');
          }

          main().catch(console.error);
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/mihoyo-versions.json
          git diff --staged --quiet || git commit -m "chore: 更新米哈游版本数据 [skip ci]"
          git push
