name: Fetch Game Version Data

on:
  workflow_dispatch: # 原每天两次的自动抓取已取消（2026-11-05），数据由 cron 任务维护；此工作流改为仅手动触发

permissions:
  contents: write

jobs:
  fetch-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run version check script
        run: node scripts/check-versions.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/game-versions.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: 更新游戏版本数据 [skip ci]"
            git push
          fi
