name: Fetch Game Version Data

on:
  schedule:
    # 每天UTC时间0点运行（北京时间8点）
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  fetch-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install cheerio

      - name: Fetch version data
        run: |
          node -e "
          const https = require('https');
          const http = require('http');
          const fs = require('fs');

          // 米哈游游戏配置
          const mihoyoGames = [
            {
              id: 'genshin',
              name: '原神',
              api: 'https://hk4e-ann-api.mihoyo.com/common/hk4e_cn/announcement/api/getAnnList?game=hk4e&game_biz=hk4e_cn&lang=zh-cn&bundle_id=hk4e_cn&platform=pc&region=cn_gf01&level=55&uid=100000000',
              pattern: /(\\d+\\.\\d+)版本.*?[「「](.+?)[」」]/
            },
            {
              id: 'starrail',
              name: '崩坏：星穹铁道',
              api: 'https://hkrpg-ann-api.mihoyo.com/common/hkrpg_cn/announcement/api/getAnnList?game=hkrpg&game_biz=hkrpg_cn&lang=zh-cn&bundle_id=hkrpg_cn&platform=pc&region=prod_gf_cn&level=65&uid=100000000',
              pattern: /(\\d+\\.\\d+)版本.*?[「「](.+?)[」」]/
            },
            {
              id: 'zzz',
              name: '绝区零',
              api: 'https://announcement-api.mihoyo.com/common/nap_cn/announcement/api/getAnnList?game=nap&game_biz=nap_cn&lang=zh-cn&bundle_id=nap_cn&platform=pc&region=prod_gf_cn&level=60&uid=100000000',
              pattern: /(\\d+\\.\\d+)版本.*?[「「](.+?)[」」]/
            }
          ];

          // 其他游戏的历史版本数据（手动维护）
          const otherGames = {
            wutheringwaves: {
              gameId: 'wutheringwaves',
              gameName: '鸣潮',
              current: {
                version: '3.2',
                name: '于影中启明的决心',
                startDate: '2026-03-19',
                endDate: '2026-04-30'
              },
              history: [
                { version: '3.2', name: '于影中启明的决心', startDate: '2026-03-19', endDate: '2026-04-30' },
                { version: '3.1', name: '月之暗面', startDate: '2026-02-06', endDate: '2026-03-19' },
                { version: '3.0', name: '潮起', startDate: '2025-12-25', endDate: '2026-02-06' },
                { version: '2.8', name: '星辉', startDate: '2025-11-13', endDate: '2025-12-25' },
                { version: '2.7', name: '回响', startDate: '2025-10-02', endDate: '2025-11-13' }
              ]
            },
            arknights: {
              gameId: 'arknights',
              gameName: '明日方舟',
              current: {
                version: '4.5',
                name: '慈悲灯塔',
                startDate: '2026-05-15',
                endDate: '2026-06-26'
              },
              history: [
                { version: '4.5', name: '慈悲灯塔', startDate: '2026-05-15', endDate: '2026-06-26' },
                { version: '4.4', name: '空想花庭', startDate: '2026-04-03', endDate: '2026-05-15' },
                { version: '4.3', name: '水晶箭行动', startDate: '2026-02-20', endDate: '2026-04-03' },
                { version: '4.2', name: '尘影余音', startDate: '2026-01-09', endDate: '2026-02-20' },
                { version: '4.1', name: '叙拉古人', startDate: '2025-11-28', endDate: '2026-01-09' }
              ]
            },
            reverse1999: {
              gameId: 'reverse1999',
              gameName: '重返未来:1999',
              current: {
                version: '3.1',
                name: '孤独之歌',
                startDate: '2026-05-08',
                endDate: '2026-06-19'
              },
              history: [
                { version: '3.1', name: '孤独之歌', startDate: '2026-05-08', endDate: '2026-06-19' },
                { version: '3.0', name: '复兴！米卢特兰', startDate: '2026-03-27', endDate: '2026-05-08' },
                { version: '2.8', name: '飞驰明日之城', startDate: '2026-02-13', endDate: '2026-03-27' },
                { version: '2.7', name: '洞穴的黄金国', startDate: '2025-12-26', endDate: '2026-02-13' },
                { version: '2.6', name: '忧郁的热带', startDate: '2025-11-14', endDate: '2025-12-26' }
              ]
            },
            arknights_endfield: {
              gameId: 'arknights_endfield',
              gameName: '明日方舟:终末地',
              current: {
                version: '1.2',
                name: '春晓时',
                startDate: '2026-04-17',
                endDate: '2026-05-29'
              },
              history: [
                { version: '1.2', name: '春晓时', startDate: '2026-04-17', endDate: '2026-05-29' },
                { version: '1.1', name: '新潮起，故渊离', startDate: '2026-03-12', endDate: '2026-04-17' },
                { version: '1.0', name: '公测', startDate: '2026-01-16', endDate: '2026-03-12' }
              ]
            },
            yihuan: {
              gameId: 'yihuan',
              gameName: '异环',
              current: {
                version: '1.1',
                name: '游梦洄廊',
                startDate: '2026-05-28',
                endDate: '2026-07-09'
              },
              history: [
                { version: '1.1', name: '游梦洄廊', startDate: '2026-05-28', endDate: '2026-07-09' },
                { version: '1.0', name: '公测', startDate: '2026-04-22', endDate: '2026-05-28' }
              ]
            },
            doublehelix: {
              gameId: 'doublehelix',
              gameName: '二重螺旋',
              current: {
                version: '1.4',
                name: '银星奔流',
                startDate: '2026-06-02',
                endDate: '2026-07-14'
              },
              history: [
                { version: '1.4', name: '银星奔流', startDate: '2026-06-02', endDate: '2026-07-14' },
                { version: '1.3', name: '皓苍诀', startDate: '2026-04-07', endDate: '2026-06-02' },
                { version: '1.2', name: '冬暮', startDate: '2026-02-10', endDate: '2026-04-07' },
                { version: '1.1', name: '大风歌·上', startDate: '2025-12-23', endDate: '2026-02-10' },
                { version: '1.0', name: '公测', startDate: '2025-10-28', endDate: '2025-12-23' }
              ]
            }
          };

          function fetchUrl(url) {
            return new Promise((resolve, reject) => {
              const protocol = url.startsWith('https') ? https : http;
              protocol.get(url, {
                headers: {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                }
              }, (res) => {
                let data = '';
                res.on('data', (chunk) => data += chunk);
                res.on('end', () => resolve(data));
              }).on('error', reject);
            });
          }

          async function fetchMihoyoGame(game) {
            try {
              const data = await fetchUrl(game.api);
              const json = JSON.parse(data);
              if (json.retcode !== 0) return null;

              const versions = [];
              const seen = new Set();

              for (const group of json.data.list) {
                for (const item of group.list) {
                  if (item.title.includes('版本更新说明') || item.title.includes('更新公告')) {
                    const match = item.title.match(game.pattern);
                    if (match && !seen.has(match[1])) {
                      seen.add(match[1]);
                      versions.push({
                        version: match[1],
                        name: match[2],
                        startDate: item.start_time.split(' ')[0],
                        endDate: item.end_time.split(' ')[0]
                      });
                    }
                  }
                }
              }

              versions.sort((a, b) => parseFloat(b.version) - parseFloat(a.version));
              return {
                gameId: game.id,
                gameName: game.name,
                current: versions[0] || null,
                history: versions.slice(0, 10)
              };
            } catch (e) {
              console.error('Error fetching', game.id, e.message);
              return null;
            }
          }

          async function main() {
            const results = {
              fetchedAt: new Date().toISOString(),
              games: {}
            };

            // 获取米哈游游戏数据
            for (const game of mihoyoGames) {
              console.log('Fetching', game.id, '...');
              const data = await fetchMihoyoGame(game);
              if (data && data.current) {
                results.games[game.id] = data;
                console.log('  Current:', data.current.version, data.current.name);
              }
            }

            // 添加其他游戏数据
            for (const [id, data] of Object.entries(otherGames)) {
              results.games[id] = data;
              console.log('Added', id, ':', data.current.version, data.current.name);
            }

            fs.writeFileSync('public/data/game-versions.json', JSON.stringify(results, null, 2));
            console.log('\\nSaved to public/data/game-versions.json');
          }

          main().catch(console.error);
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/game-versions.json
          git diff --staged --quiet || git commit -m "chore: 更新游戏版本数据 [skip ci]"
          git push
