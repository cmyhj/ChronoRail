<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ChronoRail/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ChronoRail - 二次元游戏版本时间线可视化工具" />
    <meta name="keywords" content="原神,崩坏星穹铁道,绝区零,版本更新,时间线" />
    <title>ChronoRail - 游戏版本时间线</title>
    <style>
      /* 防止FOUC */
      body {
        background: #0f0f23;
        margin: 0;
        padding: 0;
      }
    </style>
    <script>
      // 处理从 404.html 重定向回来的 URL
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
